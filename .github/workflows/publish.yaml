name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `packages: write` es lo que habilita publicar al registry de GitHub. El
      # `GITHUB_TOKEN` del job alcanza: no hace falta un PAT ni el secreto de npm.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # GitHub Packages, no npmjs.org: el paquete es interno de SolvorX.
          registry-url: https://npm.pkg.github.com
          scope: '@solvorx'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm check:types
      - run: pnpm test

      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
